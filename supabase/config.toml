# Valora local/cloud Supabase config.
# Apply path for this package: `pnpm exec prisma migrate deploy`.
# Do NOT run `supabase db push` on a database that already applied Prisma migrations (D-011).

project_id = "valora"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
